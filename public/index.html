<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050505">
    <title>Andrew's Blood Sugar</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main aria-live="polite">
      <section class="glucose" id="glucose" aria-label="Current blood sugar">
        <span id="value">---</span><span id="arrow" aria-hidden="true"></span>
      </section>
      <div class="unit">mg/dL</div>
      <time id="clock">--:--</time>
      <div id="reading-time" class="reading-time">Connecting to Dexcom…</div>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
